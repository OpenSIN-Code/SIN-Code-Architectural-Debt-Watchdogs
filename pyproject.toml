[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sin-code-adw"
version = "0.1.0"
description = "SIN-Code Architectural Debt Watchdogs — complexity, smells, and cost tracking"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["complexity", "technical-debt", "code-smells", "static-analysis"]
authors = [
  {name = "SIN-Code", email = "dev@sin-code.dev"}
]
dependencies = [
  "radon>=6.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sin_code_adw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/sin_code_adw"]
